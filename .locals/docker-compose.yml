version: "3.9"

services:
  rag-app:
    build: 
      context: .
      target: production
    container_name: intrinsical-rag-app
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_ENABLED=${OLLAMA_ENABLED:-true}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - RETRIEVAL_MODE=${RETRIEVAL_MODE:-sparse}
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
    volumes:
      - ./data:/app/data:rw
      - ./logs:/app/logs:rw
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      - ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles: ["default", "with-ollama"]

  ollama:
    image: ollama/ollama:latest
    container_name: intrinsical-ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    profiles: ["with-ollama"]

  # Development service with hot reload
  rag-dev:
    build:
      context: .
      target: builder
    container_name: intrinsical-rag-dev
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_ENABLED=${OLLAMA_ENABLED:-true}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - RETRIEVAL_MODE=${RETRIEVAL_MODE:-sparse}
    volumes:
      - .:/app:rw
      - /app/.venv
    ports:
      - "${DEV_PORT:-8001}:8000"
    command: ["uvicorn", "src.app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      - ollama
    profiles: ["dev"]

volumes:
  ollama-data:
    driver: local

networks:
  default:
    name: intrinsical-rag-network
