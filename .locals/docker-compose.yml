version: "3.9"

# Intrinsical RAG Prototype - Docker Compose Configuration
# Production-ready setup with Ollama integration and development profiles

services:
  rag-app:
    build: 
      context: .
      target: production
    container_name: intrinsical-rag-app
    environment:
      # LLM Configuration
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_ENABLED=${OLLAMA_ENABLED:-true}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
      
      # RAG Configuration
      - RETRIEVAL_MODE=${RETRIEVAL_MODE:-sparse}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      - HYBRID_ALPHA=${HYBRID_ALPHA:-0.5}
      
      # Application Configuration
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      
      # Database Configuration
      - SQLITE_URL=sqlite:///app/data/app.db
      - FAQ_CSV_PATH=/app/data/faq.csv
    volumes:
      - ./data:/app/data:rw
      - rag-cache:/app/.cache:rw
    ports:
      - "${APP_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    profiles: ["default", "with-ollama"]

  ollama:
    image: ollama/ollama:latest
    container_name: intrinsical-ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_MAX_LOADED_MODELS=2
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 45s
      timeout: 15s
      retries: 3
      start_period: 60s
    profiles: ["with-ollama"]

  # Development service with hot reload
  rag-dev:
    build:
      context: .
      target: builder
    container_name: intrinsical-rag-dev
    environment:
      # LLM Configuration
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_ENABLED=${OLLAMA_ENABLED:-true}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
      
      # RAG Configuration
      - RETRIEVAL_MODE=${RETRIEVAL_MODE:-sparse}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      - HYBRID_ALPHA=${HYBRID_ALPHA:-0.5}
      
      # Development Configuration
      - DEBUG=true
      - LOG_LEVEL=DEBUG
      
      # Database Configuration
      - SQLITE_URL=sqlite:///app/data/app.db
      - FAQ_CSV_PATH=/app/data/faq.csv
    volumes:
      - .:/app:rw
      - /opt/venv
      - dev-cache:/app/.cache:rw
    ports:
      - "${DEV_PORT:-8001}:8000"
    command: ["uvicorn", "local_rag_backend.app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    profiles: ["dev"]

volumes:
  ollama-data:
    driver: local
    name: intrinsical-ollama-data
  rag-cache:
    driver: local
    name: intrinsical-rag-cache
  dev-cache:
    driver: local
    name: intrinsical-dev-cache

networks:
  default:
    name: intrinsical-rag-network
