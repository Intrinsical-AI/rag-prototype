# Intrinsical RAG Prototype - Pre-commit Configuration
# Essential type checkers and linters

repos:
  # Python Linting, Formatting & Type Checking (Ruff replaces Black + isort + flake8)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        name: "Lint Python code (Ruff)"
        args: ["--fix", "--exit-non-zero-on-fix"]
        files: "^(src|tests)/"
      - id: ruff-format
        name: "Format Python code (Ruff)"
        files: "^(src|tests)/"

  # Type Checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        name: "Type check Python code (MyPy)"
        additional_dependencies: [types-requests, types-setuptools, pydantic, pydantic-settings]
        exclude: "^tests/"

  # Essential File Quality Checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1000"]
        exclude: "^data/openai/OpenAI-2025/mini\\.json$"

  # Security Scanning
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        name: "Security scan (Bandit)"
        args: ["-r", "src/", "-ll", "-ii"]
        pass_filenames: false
        exclude: "^tests/"

ci:
  autofix_prs: true
  autoupdate_schedule: weekly
