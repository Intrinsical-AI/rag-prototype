# Intrinsical RAG Prototype - Pre-commit Configuration
# Essential type checkers and linters

repos:
  # Python Linting, Formatting & Type Checking (Ruff replaces Black + isort + flake8)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.2
    hooks:
      - id: ruff
        name: "Lint Python code (Ruff)"
        args: ["--fix", "--exit-non-zero-on-fix"]
        files: "^(src|tests)/"
      - id: ruff-format
        name: "Format Python code (Ruff)"
        files: "^(src|tests)/"

  # Architecture Contracts
  - repo: local
    hooks:
      - id: import-linter
        name: "Enforce import boundaries (import-linter)"
        entry: env PYTHONPATH=src uv run lint-imports
        language: system
        pass_filenames: false

  # Type Checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        name: "Type check Python code (MyPy)"
        additional_dependencies:
          [types-requests, types-setuptools, types-PyYAML, pydantic, pydantic-settings]
        exclude: "^tests/"

  # Essential File Quality Checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: debug-statements
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1000"]
        exclude: "^data/openai/OpenAI-2025/mini\\.json$"

  # Security Scanning
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        name: "Security scan (Bandit)"
        args: ["-r", "src/", "-ll", "-ii"]
        pass_filenames: false
        exclude: "^tests/"

ci:
  autofix_prs: true
  autoupdate_schedule: weekly
