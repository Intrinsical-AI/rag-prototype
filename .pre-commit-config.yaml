# Intrinsical RAG Prototype - Pre-commit Configuration
# Comprehensive code quality and security checks

repos:
  # Python Code Formatting
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        name: "Format Python code (Black)"
        language_version: python3

  # Import Sorting
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: "Sort Python imports (isort)"
        args: ["--profile", "black"]

  # Python Linting & Security
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        name: "Lint Python code (Ruff)"
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format
        name: "Format Python code (Ruff)"

  # Type Checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        name: "Type check Python code (MyPy)"
        additional_dependencies: [types-requests]
        args: ["--ignore-missing-imports"]

  # General File Quality
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        name: "Remove trailing whitespace"
      - id: end-of-file-fixer
        name: "Ensure files end with newline"
      - id: check-yaml
        name: "Validate YAML files"
      - id: check-toml
        name: "Validate TOML files"
      - id: check-json
        name: "Validate JSON files"
      - id: check-merge-conflict
        name: "Check for merge conflicts"
      - id: check-added-large-files
        name: "Prevent large files"
        args: ["--maxkb=1000"]
      - id: check-case-conflict
        name: "Check filename case conflicts"
      - id: mixed-line-ending
        name: "Fix mixed line endings"

  # Security Scanning
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        name: "Security scan (Bandit)"
        args: ["-r", "src/", "-f", "json"]
        exclude: "tests/"

  # Secrets Detection
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: "Detect secrets"
        args: ["--baseline", ".secrets.baseline"]

  # Documentation
  - repo: https://github.com/pycqa/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        name: "Check docstring style"
        args: ["--convention=google"]
        files: "^src/"

  # Dockerfile Linting
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
        name: "Lint Dockerfile"

  # Markdown Linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.41.0
    hooks:
      - id: markdownlint
        name: "Lint Markdown files"
        args: ["--fix"]

  # Commit Message Linting
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.29.1
    hooks:
      - id: commitizen
        name: "Check commit message format"
        stages: [commit-msg]

ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: []
  submodules: false
