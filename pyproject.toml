[project]
name = "rag-prototype"
version = "1.3.0"
description = "Experimental-grade RAG prototype with FastAPI, FAISS, and clean hexagonal architecture"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Intrinsical-AI", email = "intrinsicalai@proton.me" }]
maintainers = [{ name = "Intrinsical-AI", email = "intrinsicalai@proton.me" }]
keywords = [
  "rag","retrieval-augmented-generation","fastapi","faiss",
  "nlp","ai","machine-learning","semantic-search","llm",
  "hexagonal-architecture","vector-search","openai","ollama",
  "Experimental","production-ready","microservices","docker"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Text Processing :: Indexing",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed"
]

dependencies = [
  # AI/ML Core (lightweight defaults; heavy deps are optional extras)
  "rank-bm25>=0.2,<1.0",
  "numpy>=2.0,<2.3",
  # LLM Integrations
  "openai>=1.24,<2.0",
  "httpx>=0.27,<0.28",
  # Database & ORM
  "sqlalchemy>=2.0,<3.0",
  # Configuration & Validation
  "pydantic>=2.0,<3.0",
  "pydantic-settings>=2.2,<3.0",
  "python-dotenv>=1.0,<2.0",
  # CLI & Utilities
  "click>=8.0,<9.0",
  "rich>=13.0,<14.0",
]

[project.optional-dependencies]
server = [
  "fastapi>=0.124,<0.125",
  "uvicorn[standard]>=0.29,<1.0",
  "python-multipart>=0.0.9,<1.0",
]
dense = [
  "faiss-cpu>=1.8.0,<2.0"
]
dense-st = [
  # Heavy dependency chain (torch/transformers). Prefer OpenAI embeddings when possible.
  "sentence-transformers>=2.7,<3.0"
]
loaders = [
  "langchain-community>=0.2,<1.0",
  "trafilatura>=1.8,<2.0"
]
magic = [
  # Optional file type detection via libmagic. Requires system libmagic on many distros.
  "python-magic>=0.4,<1.0"
]
# CPU por defecto (retro-compat mantenida)
performance = [
  "torch>=2.0,<3.0",
  "orjson>=3.10,<4.0"
]
performance-cpu = [
  "torch>=2.0,<3.0",
  "orjson>=3.10,<4.0"
]
monitoring = [
  "prometheus-client>=0.19,<1.0",
  "structlog>=23.0,<24.0",
  "sentry-sdk[fastapi]>=1.40,<2.0"
]
all = [
  "rag-prototype[server,dense,dense-st,loaders,magic,performance,monitoring]",
]

[dependency-groups]
test = [
  "pytest>=8.2,<9.0",
  "pytest-cov>=6.1.1,<7.0",
  "pytest-asyncio>=0.23,<1.0",
  "pytest-xdist>=3.5,<4.0",
]
lint = [
  "ruff>=0.4,<1.0",
  "mypy>=1.10,<2.0",
  "import-linter>=2.0,<3.0",
  "pre-commit>=4.2.0,<5.0",
]
dev = [
  { include-group = "test" },
  { include-group = "lint" },
  "ipython>=8.0,<9.0",
  "jupyter>=1.0,<2.0",
]
sec = [
  "bandit[toml]>=1.7,<2.0",
  "safety>=3.2,<4.0",
]
docs = [
  "mkdocs>=1.5,<2.0",
  "mkdocs-material>=9.5,<10.0",
  "mkdocstrings[python]>=0.24,<1.0",
  "mkdocs-mermaid2-plugin>=1.1,<2.0",
  "mkdocs-include-markdown-plugin>=6.0,<7.0",
]

[tool.uv]
default-groups = []
environments = [
  "python_version == '3.11'",
  "python_version == '3.12'",
]

[project.urls]
Homepage = "https://github.com/Intrinsical-AI/rag-prototype"
Documentation = "https://github.com/Intrinsical-AI/rag-prototype#readme"
Repository = "https://github.com/Intrinsical-AI/rag-prototype.git"
Issues = "https://github.com/Intrinsical-AI/rag-prototype/issues"
Changelog = "https://github.com/Intrinsical-AI/rag-prototype/releases"

[project.scripts]
rag-bootstrap   = "local_rag_backend.cli:rag_bootstrap"
rag-ingest      = "local_rag_backend.cli:rag_ingest"
rag-rebuild-index = "local_rag_backend.cli:rag_rebuild_index"
rag-mutate-docs = "local_rag_backend.cli:rag_mutate_docs"
rag-server      = "local_rag_backend.cli:rag_server"
rag-status      = "local_rag_backend.cli:rag_status"
rag-eval        = "local_rag_backend.cli:rag_eval"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["local_rag_backend*"]

[tool.setuptools.package-data]
"*" = ["*.txt","*.md","*.yml","*.yaml","*.json","*.toml"]
"local_rag_backend" = ["py.typed"]
"local_rag_backend.frontend" = ["*.html","*.css","*.js","*.ico"]

# === DEVELOPMENT TOOLS ===

[tool.ruff]
line-length = 100
target-version = "py311"
fix = true

[tool.ruff.lint]
select = ["E","W","F","I","B","C4","UP","ARG","SIM","S","N","RUF","PERF"]
ignore = ["E501","B008","B904","S101","S603","S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = [
  "ARG","S101","S106","S311","N","SIM105","S110",
  "C405","C403","RUF012","F841","RUF007","RUF003","E742"
]
"scripts/**/*" = ["S602","S603","S607"]
"**/conftest.py" = ["ARG001"]
"src/local_rag_backend/settings.py" = ["S104"]
"src/local_rag_backend/infrastructure/persistence/faiss/index.py" = ["S301"]

[tool.ruff.lint.isort]
known-first-party = ["local_rag_backend"]
combine-as-imports = true

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true
show_error_codes = true
exclude = "(?x)^(tests/|scripts/)"

plugins = ["pydantic.mypy"]

# Afinado del plugin de Pydantic (config en pyproject)
[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["faiss.*","rank_bm25.*","sentence_transformers.*","prometheus_client.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--cov=local_rag_backend",
  "--cov-branch",
  "--cov-report=term-missing:skip-covered",
  "--cov-fail-under=85",
  "--tb=short",
  "--durations=10"
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
norecursedirs = [".venv",".git","build","dist",".mypy_cache",".ruff_cache",".pytest_cache",".uv_cache"]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
  "ignore::PendingDeprecationWarning"
]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "integration: marks tests as integration tests",
  "unit: marks tests as unit tests",
  "e2e: marks tests as end-to-end tests",
  "gpu: marks tests requiring GPU acceleration",
  "network: marks tests requiring network access"
]

[tool.coverage.run]
branch = true
source = ["local_rag_backend"]
omit = [
  "tests/*",
  "*/__init__.py",
  "*/conftest.py",
  "scripts/*",
  "*/local_rag_backend/cli.py",
  "*/local_rag_backend/http/dependencies.py"
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if self.debug:",
  "if settings.DEBUG",
  "raise AssertionError",
  "raise NotImplementedError",
  "if 0:",
  "if __name__ == '__main__':",
  "if TYPE_CHECKING:"
]
show_missing = true
skip_covered = true

[tool.coverage.html]
directory = "htmlcov"
