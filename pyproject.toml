[project]
name = "rag-prototype"
version = "1.1.0"
description = "Enterprise-grade RAG prototype with FastAPI, FAISS, and clean hexagonal architecture"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Intrinsical-AI", email = "intrinsicalai@proton.me" }
]
maintainers = [
    { name = "Intrinsical-AI", email = "intrinsicalai@proton.me" }
]
keywords = [
    "rag", "retrieval-augmented-generation", "fastapi", "faiss",
    "nlp", "ai", "machine-learning", "semantic-search", "llm",
    "hexagonal-architecture", "vector-search", "openai", "ollama",
    "enterprise", "production-ready", "microservices", "docker"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]

dependencies = [
    # Web Framework & Server
    "fastapi>=0.111,<1.0",
    "uvicorn[standard]>=0.29,<1.0",

    # AI/ML Core
    "sentence-transformers>=2.7,<3.0",
    "faiss-cpu>=1.8.0,<2.0",
    "rank-bm25>=0.2,<1.0",
    "numpy>=2.0,<2.3",

    # LLM Integrations
    "openai>=1.24,<2.0",
    "requests>=2.31,<3.0",

    # Database & ORM
    "sqlalchemy>=2.0,<3.0",

    # Configuration & Validation
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "python-dotenv>=1.0,<2.0",

    # CLI & Utilities
    "click>=8.0,<9.0",
    "rich>=13.0,<14.0",
]

[project.optional-dependencies]
dev = [
    # Testing Framework
    "pytest>=8.2,<9.0",
    "pytest-cov>=6.1.1,<7.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-xdist>=3.5,<4.0",  # parallel testing
    "httpx>=0.27,<1.0",  # for FastAPI TestClient

    # Code Quality & Formatting
    "ruff>=0.4,<1.0",
    "black>=24.0,<25.0",
    "isort>=5.13,<6.0",
    "pre-commit>=4.2.0,<5.0",

    # Type Checking
    "mypy>=1.10,<2.0",
    "types-requests>=2.31,<3.0",

    # Development Tools
    "ipython>=8.0,<9.0",
    "jupyter>=1.0,<2.0",
]
test = [
    "pytest>=8.2,<9.0",
    "pytest-cov>=6.1.1,<7.0",
    "pytest-asyncio>=0.23,<1.0",
    "httpx>=0.27,<1.0",
]
lint = [
    "ruff>=0.4,<1.0",
    "black>=24.0,<25.0",
    "isort>=5.13,<6.0",
    "mypy>=1.10,<2.0",
    "types-requests>=2.31,<3.0",
]
docs = [
    "mkdocs>=1.5,<2.0",
    "mkdocs-material>=9.5,<10.0",
    "mkdocstrings[python]>=0.24,<1.0",
    "mkdocs-mermaid2-plugin>=1.1,<2.0",
    "mkdocs-include-markdown-plugin>=6.0,<7.0",
]
# CPU por defecto
performance = [
    "torch>=2.0,<3.0",               # acelera modelos aunque te quedes en CPU
    # faiss-cpu ya está en deps base: "faiss-cpu>=1.8.0,<2.0"
]

performance-cpu = [
    "torch>=2.0,<3.0",
]


monitoring = [
    "prometheus-client>=0.19,<1.0",
    "structlog>=23.0,<24.0",
    "sentry-sdk[fastapi]>=1.40,<2.0",
]
all = [
    # Complete development environment
    "pytest>=8.2,<9.0",
    "pytest-cov>=6.1.1,<7.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-xdist>=3.5,<4.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.4,<1.0",
    "black>=24.0,<25.0",
    "isort>=5.13,<6.0",
    "pre-commit>=4.2.0,<5.0",
    "mypy>=1.10,<2.0",
    "types-requests>=2.31,<3.0",
    "ipython>=8.0,<9.0",
    "jupyter>=1.0,<2.0",
    "mkdocs>=1.5,<2.0",
    "mkdocs-material>=9.5,<10.0",
    "mkdocstrings[python]>=0.24,<1.0",
    "mkdocs-mermaid2-plugin>=1.1,<2.0",
    "mkdocs-include-markdown-plugin>=6.0,<7.0",
    "prometheus-client>=0.19,<1.0",
    "structlog>=23.0,<24.0",
    "sentry-sdk[fastapi]>=1.40,<2.0",
]

[project.urls]
Homepage = "https://github.com/Intrinsical-AI/rag-prototype"
Documentation = "https://github.com/Intrinsical-AI/rag-prototype#readme"
Repository = "https://github.com/Intrinsical-AI/rag-prototype.git"
Issues = "https://github.com/Intrinsical-AI/rag-prototype/issues"
Changelog = "https://github.com/Intrinsical-AI/rag-prototype/releases"

[project.scripts]
# CLI commands
rag-build-index = "local_rag_backend.cli:rag_build_index"
rag-bootstrap = "local_rag_backend.cli:rag_bootstrap"
rag-server = "local_rag_backend.cli:rag_server"
rag-status = "local_rag_backend.cli:rag_status"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["local_rag_backend*"]

[tool.setuptools.package-data]
"*" = ["*.txt", "*.md", "*.yml", "*.yaml", "*.json", "*.toml"]
"local_rag_backend.frontend" = ["*.html", "*.css", "*.js", "*.ico"]
"local_rag_backend.data" = ["*.csv", "*.json", "*.parquet"]
"local_rag_backend.config" = ["*.yaml", "*.json"]

# === DEVELOPMENT TOOLS ===

[tool.ruff]
line-length = 100
target-version = "py311"
fix = true

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "S",   # bandit security
    "N",   # pep8-naming
    "RUF", # ruff-specific rules
    "PERF", # perflint performance
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "B904",  # raise from None
    "S101",  # use of assert (allowed in tests)
    "S603",  # subprocess call without shell=True
    "S607",  # starting process with partial executable path
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = [
    "ARG",   # allow unused args in tests
    "S101",  # allow assert
    "S106",  # hardcoded passwords in tests
    "S311",  # weak crypto acceptable in tests
    "N",     # naming conventions (classes, variables) in tests
    "SIM105",# try/except/pass simplification
    "S110",  # except-pass without logging in tests
    "C405",  # unnecessary list literal
    "C403",  # unnecessary list comprehension
    "RUF012",# mutable class attributes without ClassVar
    "F841",  # local variable assigned but unused
    "RUF007",# prefer itertools.pairwise (style)
    "RUF003",# ambiguous dash in comments
    "E742",  # ambiguous class/function name in tests
]
"scripts/**/*" = ["S602", "S603", "S607"]  # Allow subprocess in scripts
"**/conftest.py" = ["ARG001"]  # Allow unused fixtures
"src/local_rag_backend/settings.py" = ["S104"]
"src/local_rag_backend/infrastructure/persistence/faiss/index.py" = ["S301"]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true
show_error_codes = true
exclude = "(?x)^(tests/|scripts/)"

[[tool.mypy.overrides]]
module = [
    "faiss.*",
    "rank_bm25.*",
    "sentence_transformers.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html:htmlcov",
    "--cov-report=xml",
    "--cov-fail-under=85",
    "--tb=short",
    "--durations=10",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
    "ignore::PendingDeprecationWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "e2e: marks tests as end-to-end tests",
    "gpu: marks tests requiring GPU acceleration",
    "network: marks tests requiring network access",
]

[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "tests/*",
    "*/__init__.py",
    "*/conftest.py",
    "scripts/*",
    "src/local_rag_backend/cli.py",
    "src/local_rag_backend/app/dependencies.py",
    "src/local_rag_backend/infrastructure/persistence/faiss/faiss_.py",
    "src/local_rag_backend/scripts/build_index.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
skip_covered = true

[tool.coverage.html]
directory = "htmlcov"
