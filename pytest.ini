[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    gpu: marks tests as requiring GPU
    network: marks tests as requiring network access
    e2e: marks tests as end-to-end integration tests
    boundary: marks tests as boundary condition tests
    concurrency: marks tests as concurrency safety tests
    consistency: marks tests as data consistency validation tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
