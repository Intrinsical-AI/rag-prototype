# Intrinsical RAG Prototype - Release Pipeline
# Automated package building, testing, and publishing to PyPI

name: Release to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      test_pypi:
        description: 'Deploy to Test PyPI instead of PyPI'
        required: false
        default: false
        type: boolean
      skip_tests:
        description: 'Skip installation tests (for debugging)'
        required: false
        default: false
        type: boolean

env:
  PYTHON_VERSION: '3.11'

jobs:
  # Pre-release validation
  validate:
    name: Pre-release Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine check-manifest

      - name: Validate package metadata
        run: |
          python -m build --sdist --wheel
          twine check dist/*
          check-manifest

      - name: Validate version consistency
        run: |
          # Check that version in pyproject.toml matches git tag (if release)
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
            TAG_VERSION=${GITHUB_REF#refs/tags/v}
            if [ "$VERSION" != "$TAG_VERSION" ]; then
              echo "Version mismatch: pyproject.toml=$VERSION, tag=$TAG_VERSION"
              exit 1
            fi
          fi

  # Build and publish package
  build-and-publish:
    name: Build & Publish Package
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build package
        run: |
          python -m build
          ls -la dist/

      - name: Verify package contents
        run: |
          twine check dist/*
          # Extract and inspect wheel contents
          python -m zipfile -l dist/*.whl

      - name: Publish to Test PyPI
        if: github.event.inputs.test_pypi == 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: |
          twine upload --repository testpypi dist/* --verbose

      - name: Publish to PyPI
        if: github.event_name == 'release' && github.event.action == 'published'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          twine upload dist/* --verbose

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          retention-days: 90

  # Test package installation across platforms
  test-install:
    name: Test Installation (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: build-and-publish
    runs-on: ${{ matrix.os }}
    if: github.event.inputs.skip_tests != 'true'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12']
        exclude:
          # Reduce matrix for faster feedback
          - os: macos-latest
            python-version: '3.12'
    
    steps:
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Wait for package availability
        if: github.event_name == 'release'
        run: |
          echo "Waiting 2 minutes for package to be available on PyPI..."
          sleep 120

      - name: Test installation from PyPI
        if: github.event.inputs.test_pypi != 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install intrinsical-rag-prototype
          
          # Test basic import and version
          python -c "import local_rag_backend; print(f'Version: {local_rag_backend.__version__}')"
          
          # Test CLI commands (allow failure for missing dependencies)
          rag-status || echo "rag-status failed (expected if dependencies missing)"
          rag-dev --help || echo "rag-dev failed (expected if dependencies missing)"
          
          # Test basic functionality without heavy dependencies
          python -c "
          from local_rag_backend.core.entities import Document
          from local_rag_backend.core.settings import Settings
          doc = Document(id='test', content='Hello World')
          settings = Settings()
          print('✅ Basic functionality works')
          "
          
          python -m pip uninstall -y intrinsical-rag-prototype

      - name: Test installation from Test PyPI
        if: github.event.inputs.test_pypi == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple intrinsical-rag-prototype
          
          # Test basic functionality
          python -c "import local_rag_backend; print(f'Version: {local_rag_backend.__version__}')"
          rag-status || echo "rag-status failed (expected if dependencies missing)"
          
          python -m pip uninstall -y intrinsical-rag-prototype

  # Create GitHub release notes
  release-notes:
    name: Update Release Notes
    needs: [build-and-publish, test-install]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update release with package info
        uses: actions/github-script@v7
        with:
          script: |
            const release = await github.rest.repos.getRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: context.payload.release.id
            });
            
            const packageInfo = `
            
            ## 📦 Package Information
            
            - **PyPI**: https://pypi.org/project/intrinsical-rag-prototype/
            - **Installation**: \`pip install intrinsical-rag-prototype\`
            - **Docker**: \`docker pull intrinsical-rag-prototype:${context.payload.release.tag_name}\`
            
            ## 🚀 Quick Start
            
            \`\`\`bash
            pip install intrinsical-rag-prototype
            rag-status
            rag-dev
            \`\`\`
            `;
            
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: context.payload.release.id,
              body: release.data.body + packageInfo
            });

  # Notify on completion
  notify:
    name: Notify Release Completion
    needs: [build-and-publish, test-install, release-notes]
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'release'
    
    steps:
      - name: Release Summary
        run: |
          echo "🎉 Release Pipeline Complete!"
          echo "📦 Package published to PyPI"
          echo "✅ Installation tested across platforms"
          echo "📝 Release notes updated"
          echo "🔗 https://pypi.org/project/intrinsical-rag-prototype/"
