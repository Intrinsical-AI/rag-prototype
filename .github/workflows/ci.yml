name: CI

on:
  push:
    branches:
      - 'main'
      - 'master'
      - 'develop'
      - 'release**'
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
      - 'CHANGELOG*'
  pull_request:
    branches:
      - 'main'
      - 'master'
      - 'develop'
      - 'release**'
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
      - 'CHANGELOG*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  # Keep uv cache in-repo to avoid non-writable HOME issues in some runners/containers.
  UV_CACHE_DIR: '.uv_cache'

jobs:
  pre-commit:
    name: Pre-commit (all files)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5.5.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv (cached)
        uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b # v7.3.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
          cache-suffix: pre-commit

      - name: Create virtualenv
        run: uv venv

      - name: Install deps for hooks
        run: |
          uv sync --frozen --extra lint --no-install-project --no-dev
          uv pip install pre-commit

      - name: Run pre-commit hooks
        run: uv run pre-commit run --all-files --show-diff-on-failure

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5.5.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv (cached)
        uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b # v7.3.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
          cache-suffix: lint

      - name: Create virtualenv
        run: uv venv

      - name: Install lint deps (extras)
        run: uv sync --frozen --extra lint --no-install-project --no-dev

      - name: Ruff
        run: uv run ruff check .

      - name: Ruff format (check)
        run: uv run ruff format --check .

  typing:
    name: Typing (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5.5.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv (cached)
        uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b # v7.3.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
          cache-suffix: typing

      - name: Create virtualenv
        run: uv venv

      - name: Install typing deps (extras lint)
        run: uv sync --frozen --extra lint --no-install-project --no-dev

      - name: mypy
        run: uv run mypy .

  test:
    name: Tests (Ubuntu, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5.5.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv (cached)
        uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b # v7.3.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
          cache-suffix: test-py${{ matrix.python-version }}

      - name: Create virtualenv
        run: uv venv

      - name: Install deps
        run: uv sync --frozen --extra dev --extra test

      - name: Run tests
        run: >
          uv run pytest
          --cov-report=xml:coverage.xml
          --cov-context=test
          --junit-xml=pytest-results.xml
          --numprocesses=auto
          --dist=worksteal
          -v

      - name: Upload coverage to Codecov
        if: ${{ matrix.python-version == '3.11' }}
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5.5.2
        continue-on-error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-ubuntu-py${{ matrix.python-version }}
          path: pytest-results.xml
          retention-days: 7

  test-windows-smoke:
    name: Tests (Windows smoke)
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5.5.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv (cached)
        uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b # v7.3.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
          cache-suffix: test-windows-smoke

      - name: Create virtualenv
        run: uv venv

      - name: Install deps
        run: uv sync --frozen --extra dev --extra test

      - name: Run smoke tests (cross-platform persistence paths)
        run: >
          uv run pytest -o addopts='' -q
          tests/unit/infrastructure/persistence/faiss/test_faiss_index.py
          tests/unit/infrastructure/persistence/faiss/test_faiss_index_race.py
          tests/unit/infrastructure/persistence/faiss/test_vector_storage_manifest_guard.py
          tests/unit/core/services/test_maintenance.py

  security:
    name: Security Scan (bandit + safety)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5.5.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv (cached)
        uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b # v7.3.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock
          cache-suffix: security

      - name: Create virtualenv
        run: uv venv

      - name: Install security tools
        run: uv sync --frozen --extra sec --no-install-project --no-dev

      - name: Run security scans (fail on findings)
        run: |
          uv run bandit -r src/ -ll -ii -f json -o bandit-report.json
          if uv run safety --help | grep -qE '(^|[[:space:]])scan([[:space:]]|$)'; then
            if [ -n "${SAFETY_API_KEY:-}" ]; then
              uv run safety scan --key "$SAFETY_API_KEY" > safety-report.txt
            else
              uv run safety scan > safety-report.txt
            fi
          else
            if [ -n "${SAFETY_API_KEY:-}" ]; then
              uv run safety check --full-report --json --output safety-report.json --key "$SAFETY_API_KEY"
            else
              uv run safety check --full-report --json --output safety-report.json
            fi
          fi
        env:
          SAFETY_API_KEY: ${{ secrets.SAFETY_API_KEY }}

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json
            safety-report.txt
          retention-days: 7

  docker:
    name: Docker Build
    needs: [pre-commit, lint, typing, test, security]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build production image (cache to GHA)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: production
          push: false
          tags: intrinsical/rag-prototype:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
