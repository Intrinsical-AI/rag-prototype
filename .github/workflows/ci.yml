name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff + black --check)
        run: |
          ruff check .
          black --check .

      - name: Run unit & integration tests with coverage
        run: pytest --cov=src --cov-report=term-missing

  # ---------- build de la imagen (opcional) ----------
  docker-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & cache image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false               # cambia a true si vas a publicar
          tags: local-rag-backend:ci
          cache-from: type=gha      # aprovecha cache previa
          cache-to:   type=gha,mode=max
