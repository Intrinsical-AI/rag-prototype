name: CI

on:
  push:
    branches: [ main, master, develop ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
      - 'CHANGELOG*'
  pull_request:
    branches: [ main, master, develop ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
      - 'CHANGELOG*'
  workflow_dispatch:

# Evita colas inútiles por rama/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Endurece permisos por defecto
permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  UV_CACHE_DIR: .uv-cache

jobs:
  lint:
    name: Lint (ruff, black, isort)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install lint deps
        run: |
          uv pip install -e ".[lint]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Black (check)
        run: black --check .

      - name: isort (check-only)
        run: isort --check-only .

  typing:
    name: Typing (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install typing deps
        run: |
          uv pip install -e ".[lint]"
      - name: mypy
        run: mypy .

  test:
    name: Tests (Ubuntu, Python ${{ env.PYTHON_VERSION }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv pip install -e ".[dev,test]"

      - name: Run tests
        run: >
          pytest
          --cov=src
          --cov-report=xml
          --cov-report=term-missing
          --junit-xml=pytest-results.xml
          --numprocesses=auto
          --dist=worksteal
          -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}  # opcional en repos públicos
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-ubuntu-py311
          path: pytest-results.xml
          retention-days: 7

  security:
    name: Security Scan (bandit + safety)
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install security tools
        run: |
          uv pip install "bandit[toml]" safety

      - name: Run security scans
        run: |
          bandit -r src/ -f json -o bandit-report.json || true
          safety check --full-report --json --output safety-report.json ${SAFETY_API_KEY:+--key $SAFETY_API_KEY} || true
        env:
          SAFETY_API_KEY: ${{ secrets.SAFETY_API_KEY }}

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json
          retention-days: 7

  docker:
    name: Docker Build
    needs: [lint, typing, test, security]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Si vas a publicar en GHCR, descomenta el login:
      # - name: Log in to GHCR
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (cache to GHA)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: intrinsical-rag-prototype:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
