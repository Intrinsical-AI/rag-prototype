services:
  rag-backend:
    build:
      context: .
      target: production
    image: intrinsical/rag-prototype:latest
    container_name: rag-backend
    environment:
      - RAG_CONFIG_PATH=/app/config.yaml
      - API_KEY=${API_KEY:?Set API_KEY before starting Compose}
      - OLLAMA_BASE_URL=http://ollama:11434
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - rag_data:/app/data
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.35.1
    container_name: ollama
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # Optional: pre-pull models on first run:
    # ["/bin/sh","-c","/bin/ollama serve & sleep 5 && ollama pull lfm2.5-thinking && tail -f /dev/null"]

volumes:
  rag_data:
  ollama_data:
